name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (module de scoring)
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build_output.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build_output.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Surface failure as annotations (public, readable without login)
        if: failure()
        shell: bash
        run: |
          {
            grep -n '^e: ' build_output.log || true
            grep -n -A 6 'What went wrong' build_output.log || true
          } | head -n 18 > summary.log
          if [ ! -s summary.log ]; then
            tail -n 15 build_output.log > summary.log
          fi
          while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g')
            echo "::error::${esc}"
          done < summary.log

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teranga-shield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
